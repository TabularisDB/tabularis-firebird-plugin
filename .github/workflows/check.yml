name: Check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
jobs:
  firebird-linux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '3'
            runner: ubuntu-22.04
          - version: '4'
            runner: ubuntu-22.04
          - version: '5'
            runner: ubuntu-22.04
          - version: '5'
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native Linux client against Firebird ${{ matrix.version }}
        run: bash tests/live-firebird.sh '${{ matrix.version }}'
  firebird-macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native macOS client against Firebird 5
        run: bash tests/live-firebird-macos.sh
  packages:
    uses: ./.github/workflows/packages.yml
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install jsonschema==4.25.1
      - run: python tests/validate_manifest.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --all-targets --no-deps --locked -- -D warnings
  firebird-live:
    runs-on: windows-latest
    strategy:
      matrix:
        version: ['3', '4', '5']
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test against portable Firebird ${{ matrix.version }}
        shell: pwsh
        run: ./tests/live-firebird.ps1 -Version '${{ matrix.version }}' -OperationalTests
      - name: Upload operational measurements
        uses: actions/upload-artifact@v5
        with:
          name: firebird-operations-${{ matrix.version }}
          path: target/operations/*.json
          retention-days: 7
      - name: Test individual wire ciphers and plaintext policy
        if: matrix.version == '5'
        shell: pwsh
        run: |
          foreach ($cipher in @('ChaCha64','ChaCha','Arc4','Disabled')) {
            ./tests/live-firebird.ps1 -Version 5 -ServerWireCrypt $cipher
            if (!$?) { throw "Wire cipher test failed: $cipher" }
          }
