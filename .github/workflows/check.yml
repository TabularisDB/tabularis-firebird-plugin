name: Check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
jobs:
  packages:
    uses: ./.github/workflows/packages.yml
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install jsonschema==4.25.1
      - run: python tests/validate_manifest.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --all-targets --no-deps --locked -- -D warnings
  firebird-live:
    runs-on: windows-latest
    strategy:
      matrix:
        version: ['3', '4', '5']
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test against portable Firebird ${{ matrix.version }}
        shell: pwsh
        run: ./tests/live-firebird.ps1 -Version '${{ matrix.version }}'
