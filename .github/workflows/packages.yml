name: Packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: win-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --bin firebird-plugin --target ${{ matrix.target }}
      - name: Package and test extracted driver
        shell: pwsh
        run: ./tests/package.ps1 -Target '${{ matrix.target }}' -Platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v5
        with:
          name: firebird-plugin-${{ matrix.platform }}
          path: target/firebird-plugin-${{ matrix.platform }}.zip
          retention-days: 7
