[package]
name = "firebird-plugin"
version = "0.2.0-beta.1"
edition = "2021"
description = "Tabularis driver plugin for Firebird"
repository = "https://github.com/TabularisDB/tabularis-firebird-plugin"
license = "Apache-2.0"
publish = false

[workspace]
members = ["vendor/rsfbclient-rust"]
default-members = ["."]

[dependencies]
serde_json = "1"
rsfbclient-core = "0.29"
rsfbclient-rust = { path = "vendor/rsfbclient-rust" }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
