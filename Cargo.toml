[package]
name = "firebird-plugin"
version = "0.1.0"
edition = "2021"
description = "Tabularis driver plugin for Firebird"
license = "Apache-2.0"
publish = false

[dependencies]
serde_json = "1"
rsfbclient = { version = "0.29", default-features = false, features = ["pure_rust"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
